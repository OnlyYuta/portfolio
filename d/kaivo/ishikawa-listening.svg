<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 660" width="1520" height="660"><rect width="1520" height="660" fill="#fff"/><text x="760.0" y="33.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2328">KAIVO: диаграмма Исикавы. Почему своя Hi-Res коллекция звучит по-разному на разных устройствах</text><line x1="60" y1="330" x2="1220" y2="330" stroke="#1f2328" stroke-width="3"/><path d="M1220,316 L1238,330 L1220,344" fill="#1f2328"/><rect x="1242" y="268" width="250" height="124" rx="8" fill="#fff4f2" stroke="#c4432b" stroke-width="1.8"/><text x="1367" y="311.2" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#8a2a17">Одна и та же коллекция</text><text x="1367" y="326.8" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#8a2a17">звучит и настраивается</text><text x="1367" y="342.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#8a2a17">по-разному на каждом</text><text x="1367" y="358.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#8a2a17">устройстве</text><line x1="280" y1="90" x2="450" y2="330" stroke="#3b5ba5" stroke-width="2"/><rect x="195" y="56" width="170" height="26" rx="5" fill="#3b5ba5"/><text x="280" y="73.5" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">Платформы</text><line x1="306.5" y1="150.0" x2="322.5" y2="150.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="302.5" y="154.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">iOS и Android ресемплят звук</text><line x1="349.0" y1="210.0" x2="365.0" y2="210.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="345.0" y="214.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">свой плеер на каждой ОС</text><line x1="391.5" y1="270.0" x2="407.5" y2="270.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="387.5" y="274.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">нет bit-perfect в штатных</text><line x1="620" y1="90" x2="790" y2="330" stroke="#3b5ba5" stroke-width="2"/><rect x="535" y="56" width="170" height="26" rx="5" fill="#3b5ba5"/><text x="620" y="73.5" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">Форматы</text><line x1="646.5" y1="150.0" x2="662.5" y2="150.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="642.5" y="154.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">DSD не играет штатно</text><line x1="689.0" y1="210.0" x2="705.0" y2="210.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="685.0" y="214.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">24/192 режется до 48 кГц</text><line x1="731.5" y1="270.0" x2="747.5" y2="270.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="727.5" y="274.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">конвертация теряет качество</text><line x1="960" y1="90" x2="1130" y2="330" stroke="#3b5ba5" stroke-width="2"/><rect x="875" y="56" width="170" height="26" rx="5" fill="#3b5ba5"/><text x="960" y="73.5" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">Настройки</text><line x1="986.5" y1="150.0" x2="1002.5" y2="150.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="982.5" y="154.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">EQ не переносится</text><line x1="1029.0" y1="210.0" x2="1045.0" y2="210.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="1025.0" y="214.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">пресеты ищут вручную</text><line x1="1071.5" y1="270.0" x2="1087.5" y2="270.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="1067.5" y="274.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">файлы AutoEq не открыть</text><line x1="280" y1="570" x2="450" y2="330" stroke="#3b5ba5" stroke-width="2"/><rect x="195" y="578" width="170" height="26" rx="5" fill="#3b5ba5"/><text x="280" y="595.5" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">Приложения</text><line x1="306.5" y1="510.0" x2="322.5" y2="510.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="302.5" y="514.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">стриминг не видит свои файлы</text><line x1="349.0" y1="450.0" x2="365.0" y2="450.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="345.0" y="454.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">плееры для аудиофилов устарели</text><line x1="391.5" y1="390.0" x2="407.5" y2="390.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="387.5" y="394.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">интерфейсы без дизайна</text><line x1="620" y1="570" x2="790" y2="330" stroke="#3b5ba5" stroke-width="2"/><rect x="535" y="578" width="170" height="26" rx="5" fill="#3b5ba5"/><text x="620" y="595.5" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">Данные</text><line x1="646.5" y1="510.0" x2="662.5" y2="510.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="642.5" y="514.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">плейлисты не синхронны</text><line x1="689.0" y1="450.0" x2="705.0" y2="450.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="685.0" y="454.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">история слушания разная</text><line x1="731.5" y1="390.0" x2="747.5" y2="390.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="727.5" y="394.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">облако требует аккаунт</text><line x1="960" y1="570" x2="1130" y2="330" stroke="#3b5ba5" stroke-width="2"/><rect x="875" y="578" width="170" height="26" rx="5" fill="#3b5ba5"/><text x="960" y="595.5" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">Пользователь</text><line x1="986.5" y1="510.0" x2="1002.5" y2="510.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="982.5" y="514.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">не разбирается в DSP</text><line x1="1029.0" y1="450.0" x2="1045.0" y2="450.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="1025.0" y="454.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">не знает про ресемплинг</text><line x1="1071.5" y1="390.0" x2="1087.5" y2="390.0" stroke="#3b5ba5" stroke-width="1.2"/><text x="1067.5" y="394.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">не хочет отдавать данные</text><text x="760.0" y="642.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#57606a">Корневая причина: нет одного плеера с общим аудиоядром и общими настройками звука для всех платформ. Его и закрывает KAIVO.</text></svg>